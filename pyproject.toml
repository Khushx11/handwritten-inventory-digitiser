[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-sheet-digitiser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.16.3", "Pillow==12.0.0", "scikit-learn==1.7.2"]

[project.optional-dependencies]
browser = ["playwright==1.65.2"]
plots = ["matplotlib==3.10.6"]

[project.scripts]
inventory-digitiser = "inventory.webserver:main"

[tool.setuptools.package-data]
inventory = ["web/*", "catalogue.json", "uji_training.json"]

[tool.setuptools.packages.find]
include = ["inventory*"]
