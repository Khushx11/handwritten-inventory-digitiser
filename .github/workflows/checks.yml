name: Inventory checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: node --check inventory/web/app.js
      - run: python -m inventory.evaluate --output /tmp/inventory-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-stocktake-metrics-py${{ matrix.python }}
          path: /tmp/inventory-metrics.json
      - name: Check held-out real pen strokes
        if: matrix.python == '3.13'
        run: |
          curl --fail --location --retry 3 'https://archive.ics.uci.edu/static/public/160/uji+pen+characters.zip' -o /tmp/uji.zip
          python -m inventory.writer_benchmark /tmp/uji.zip --output /tmp/inventory-writer-metrics.json
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: held-out-writer-stocktake-metrics
          path: /tmp/inventory-writer-metrics.json
      - name: Check upload, source crops, correction and export in Chromium
        if: matrix.python == '3.13'
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          python -m inventory.webserver --workspace /tmp/inventory-browser &
          server=$!
          trap 'kill "$server"' EXIT
          curl --silent --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8010/ >/dev/null
          python tests/browser_smoke.py
