name: Additional handwriting evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - inventory/extra_datasets.py
      - inventory/extra_training.py
      - inventory/portable_model.py
      - inventory/segmentation.py
      - inventory/sheet_training.py
      - inventory/external_digits.py
      - .github/workflows/additional-handwriting.yml
permissions:
  contents: read
jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LOKY_MAX_CPU_COUNT: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install .
      - name: Download official datasets
        run: |
          mkdir -p runtime
          curl -fsSL --retry 3 'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz' -o runtime/mnist.npz
          curl -fsSL --retry 3 'https://archive.ics.uci.edu/static/public/81/pen+based+recognition+of+handwritten+digits.zip' -o runtime/pendigits.zip
          curl -fsSL --retry 3 'https://archive.ics.uci.edu/static/public/160/uji+pen+characters.zip' -o runtime/uji-pen.zip
      - name: Train and score official test partitions
        run: |
          python -m inventory.extra_training --mnist runtime/mnist.npz --pendigits runtime/pendigits.zip \
            --output runtime/digit-metrics.json --weights runtime/handwriting-mlp.npz
      - name: Score transfer on held-out UJI writers
        run: |
          python -m inventory.writer_benchmark runtime/uji-pen.zip --model runtime/handwriting-mlp.npz \
            --output runtime/writer-metrics.json
      - name: Evaluate degradation training on the paired stress set
        run: |
          python -m inventory.extra_training --mnist runtime/mnist.npz --pendigits runtime/pendigits.zip \
            --robust --output runtime/robust-digit-metrics.json --weights runtime/handwriting-robust.npz
          python -m inventory.writer_benchmark runtime/uji-pen.zip --model runtime/handwriting-mlp.npz \
            --extended-stress --output runtime/stress-standard-model.json
          python -m inventory.writer_benchmark runtime/uji-pen.zip --model runtime/handwriting-robust.npz \
            --extended-stress --output runtime/stress-augmented-model.json
      - name: Check conservative routing with both models
        run: |
          python -m inventory.writer_benchmark runtime/uji-pen.zip \
            --model runtime/handwriting-robust.npz --comparison-model runtime/handwriting-mlp.npz \
            --extended-stress --gate-scan-quality --output runtime/stress-cross-checked-model.json
      - uses: actions/checkout@v4
        with:
          repository: niklashenning/hwd-1000-dataset
          ref: 93b3ba9e45624ee557360229a42298eaa6b3a106
          path: runtime/hwd-1000
          persist-credentials: false
      - name: Verify touching-digit recovery and external handwriting transfer
        run: |
          python -m inventory.extra_training --mnist runtime/mnist.npz --pendigits runtime/pendigits.zip \
            --sheet-adapted --output runtime/sheet-adapted-digit-results.json --weights runtime/handwriting-sheet-adapted.npz
          python -m inventory.writer_benchmark runtime/uji-pen.zip \
            --model runtime/handwriting-robust.npz --comparison-model runtime/handwriting-mlp.npz \
            --extended-stress --gate-scan-quality --recover-touching --output runtime/touching-sku-results.json
          python -m inventory.writer_benchmark runtime/uji-pen.zip \
            --model runtime/handwriting-sheet-adapted.npz --comparison-model runtime/handwriting-mlp.npz \
            --extended-stress --gate-scan-quality --recover-touching --output runtime/sheet-adapted-stress-results.json
          python -m inventory.external_digits runtime/hwd-1000 --robust runtime/handwriting-robust.npz \
            --sheet-adapted runtime/handwriting-sheet-adapted.npz --output runtime/external-digit-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: additional-handwriting-metrics
          path: |
            runtime/digit-metrics.json
            runtime/writer-metrics.json
            runtime/robust-digit-metrics.json
            runtime/stress-standard-model.json
            runtime/stress-augmented-model.json
            runtime/stress-cross-checked-model.json
            runtime/sheet-adapted-digit-results.json
            runtime/touching-sku-results.json
            runtime/sheet-adapted-stress-results.json
            runtime/external-digit-results.json
